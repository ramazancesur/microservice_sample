input {
  beats {
    port => 5044
  }
}

filter {
  # Attempt to parse JSON log lines emitted by logstash-logback-encoder
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "log"
    }
    mutate {
      rename => { "[log][service]"    => "service"    }
      rename => { "[log][level]"      => "level"      }
      rename => { "[log][logger_name]" => "logger"    }
      rename => { "[log][message]"    => "log_message" }
      rename => { "[log][traceId]"    => "trace_id"   }
    }
  }

  # Add a human-readable timestamp
  date {
    match => ["[log][@timestamp]", "ISO8601"]
    target => "@timestamp"
    remove_field => ["[log][@timestamp]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "banking-logs-%{+YYYY.MM.dd}"
  }
}
